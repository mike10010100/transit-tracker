name: CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version-bump-check:
    name: Enforce Semantic Version Bump & CHANGELOG on PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Semantic Version Bump & CHANGELOG Entry
        run: |
          chmod +x ./scripts/check_version_bump.sh
          ./scripts/check_version_bump.sh

  go-client:
    name: Go Client (test, lint, race, signed build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-go

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Verify Formatting (gofmt)
        run: |
          DIFF=$(gofmt -s -d .)
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            echo "ERROR: Go files are not formatted properly. Run 'gofmt -s -w .' locally."
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Vulnerability Audit (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./... || true

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Enforce Go Coverage Gate (93%)
        run: bash ../scripts/check_coverage_go.sh 93

      # Exercise the full signed-release path with a throwaway key: embed the
      # public key, sign the manifest, mint a server cert, and verify.
      - name: Cross-Compile + Sign ARMv7 Binary (ephemeral key)
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/ci_ota.key"
          go run ./cmd/otasign keygen -out "$KEY" >/dev/null
          PUB=$(go run ./cmd/otasign pubkey -key "$KEY")
          VERSION=$(tr -d '[:space:]' < ../VERSION)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.OTAPublicKey=${PUB}" -o ../tracker-arm .
          go run ./cmd/otasign sign -key "$KEY" -version "$VERSION" -in ../tracker-arm -out ../tracker-arm.manifest.json
          go run ./cmd/otasign server-cert -key "$KEY" -out-key "$RUNNER_TEMP/server_identity.key" -out-cert "$RUNNER_TEMP/server_identity.cert.json"
          go run ./cmd/otasign verify -pub "$PUB" -manifest ../tracker-arm.manifest.json -in ../tracker-arm
          ls -lh ../tracker-arm

  shell:
    name: Shell scripts (syntax, shellcheck, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check scripts
        run: make check-sh

      - name: Run Shell test suite
        run: make test-sh

  python-server:
    name: Python Server (lint, typecheck, tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Formatting (ruff)
        run: make fmt-py-check

      - name: Lint (ruff)
        run: python -m ruff check server tests

      - name: Static Type Checking (mypy)
        run: python -m mypy server

      - name: Dependency Security Audit (pip-audit)
        run: pip-audit -r requirements.txt || true

      - name: Run Python unit tests
        run: make test-py

      - name: Enforce Python Coverage Gate (92%)
        run: make coverage-py

  docker:
    name: Docker image (hadolint, signed build, ephemeral key)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Generate throwaway signing key
        run: openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/ci_ota.key"

      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build --secret id=ota_signing_key,src="$RUNNER_TEMP/ci_ota.key" -t transit-tracker:ci .

      - name: Smoke test (signed release + identity present, non-root)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh transit-tracker:ci -c \
            'test -s tracker-arm && test -s tracker-arm.manifest.json && test -s server_identity.cert.json && test -s server_identity.key && command -v setpriv'
          docker run -d --name tt -p 18000:8000 transit-tracker:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:18000/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:18000/tracker-arm.manifest
          docker top tt | grep 'server.py' | grep -vq '^root'
          docker rm -f tt

  release:
    name: Auto-Create GitHub Release
    runs-on: ubuntu-latest
    needs: [go-client, shell, python-server, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      checks: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract Current Version
        id: pkg_info
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"

      - name: Check if Version Already Released on GitHub
        id: check_released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.pkg_info.outputs.version }}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg_info.outputs.version }} is already released on GitHub."
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg_info.outputs.version }} is NOT released on GitHub yet."
          fi

      - name: Create or Update GitHub Release Tag
        if: steps.check_released.outputs.released == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "v${{ steps.pkg_info.outputs.version }}"
        run: |
          echo "Creating GitHub Release ${TAG_NAME}..."
          if [ -f CHANGELOG.md ]; then
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME} - Production Release" \
              --notes-file CHANGELOG.md
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME} - Production Release" \
              --generate-notes
          fi
