[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security analysis)
]
ignore = [
    "E501", # line length is handled by ruff format
    "S101", # allow assert in tests
    "S104", # binding to 0.0.0.0 is intended for LAN server
    "S110", # try-except-pass in fallback/cleanup routines
    "S112", # try-except-continue in fallback loops
    "S310", # urllib.request.urlopen for known HTTP endpoints
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "S110"]
"server/discovery.py" = ["S104"]
"server/server.py" = ["S104"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.coverage.run]
source = ["server"]
branch = true
omit = [
    "tests/*",
    "test_*.py",
    "client-go/*",
    "scratch/*",
]

[tool.coverage.report]
fail_under = 92
show_missing = true

[tool.pytest.ini_options]
pythonpath = ["server"]

[tool.mutmut]
paths_to_mutate = ["server/identity.py"]
tests_dir = ["tests/test_security_spec.py"]
also_copy = [
    "server/bus_tracker.py",
    "server/canvas.py",
    "server/citibike.py",
    "server/device_registry.py",
    "server/discovery.py",
    "server/evening_view.py",
    "server/gtfs_bus.py",
    "server/kindle_image.py",
    "server/logsafe.py",
    "server/morning_view.py",
    "server/ota.py",
    "server/paths.py",
    "server/render_dashboard.py",
    "server/schedule.py",
    "server/server.py",
    "server/version.py",
    "client-go/",
]

