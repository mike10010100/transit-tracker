services:
  transit-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 1 = allow building without a signing key (dev only; devices are then
        # never offered the binary and it can never OTA-update itself).
        ALLOW_UNSIGNED_OTA: ${ALLOW_UNSIGNED_OTA:-0}
      # The release signing key is passed to the build as a BuildKit secret, so
      # it never lands in an image layer or the build cache. Create it once with
      # `make keygen` (or `openssl genpkey -algorithm ed25519 -out secrets/ota_ed25519.key`).
      secrets:
        - ota_signing_key
    image: transit-tracker:${IMAGE_TAG:-latest}
    container_name: transit-tracker
    restart: unless-stopped
    # On Linux servers (Raspberry Pi, mini PC, NAS, Unraid), network_mode: host
    # allows the container to bind directly to the LAN interface. This enables:
    # 1. Zero-config mDNS service advertisement (_transittracker._tcp.local)
    # 2. Receiving Kindle UDP discovery broadcasts (port 8001) without NAT traversal
    # Note: the server then listens on every host interface. Control endpoints
    # always require TRACKER_CONTROL_TOKEN (auto-generated if unset).
    network_mode: host
    environment:
      - PORT=${PORT:-8000}
      - TZ=${TZ:-America/New_York}
      - NJT_USERNAME=${NJT_USERNAME:-}
      - NJT_PASSWORD=${NJT_PASSWORD:-}
      - NJT_API_USERNAME=${NJT_API_USERNAME:-}
      - NJT_API_PASSWORD=${NJT_API_PASSWORD:-}
      # Shared secret for /stop, /resume, /mode, /action and /diag. When unset,
      # one is generated on first start, stored in the cache volume and printed
      # to the container log.
      - TRACKER_CONTROL_TOKEN=${TRACKER_CONTROL_TOKEN:-}
      # Schedule: copy config/schedule.example.json to config/schedule.json and
      # edit it (hot-reloaded, no restart). See docs/architecture.md.
      - SCHEDULE_CONFIG=${SCHEDULE_CONFIG:-/app/config/schedule.json}
      # Legacy schedule overrides. They take precedence over schedule.json, so
      # they are passed through only when set (empty = unset). Prefer the file.
      #   PEAK_AM_START/END, PEAK_PM_START/END: peak windows (decimal hours)
      #   PEAK_WEEKENDS=1: weekend peaks; OVERNIGHT_START/END: overnight window
      #   OFFPEAK_INTERVAL / OVERNIGHT_INTERVAL: poll intervals (seconds)
      - PEAK_AM_START=${PEAK_AM_START:-}
      - PEAK_AM_END=${PEAK_AM_END:-}
      - PEAK_PM_START=${PEAK_PM_START:-}
      - PEAK_PM_END=${PEAK_PM_END:-}
      - PEAK_WEEKENDS=${PEAK_WEEKENDS:-}
      - OVERNIGHT_START=${OVERNIGHT_START:-}
      - OVERNIGHT_END=${OVERNIGHT_END:-}
      - OVERNIGHT_INTERVAL=${OVERNIGHT_INTERVAL:-}
      - OFFPEAK_INTERVAL=${OFFPEAK_INTERVAL:-}
      # Testing aids: force the fast poll interval at all hours, or pin a phase.
      - FORCE_FAST_POLL=${FORCE_FAST_POLL:-}
      - FORCE_PHASE=${FORCE_PHASE:-}
      # Run mode the client should adopt and stick to. Defaults to sleep-suspend
      # so a dedicated dashboard survives OTA restarts (the client comes back up
      # as resident and the sticky desired-mode re-asserts sleep-suspend).
      - TRACKER_DEFAULT_MODE=${TRACKER_DEFAULT_MODE:-sleep-suspend}
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist the GTFS static-schedule index across container recreates so the
      # 55 MB feed isn't re-downloaded and re-parsed on every deploy. Also holds
      # the auto-generated control token.
      - tracker-cache:/app/cache
      # Schedule state machine config (schedule.json).
      - ./config:/app/config
    healthcheck:
      # $$ defers expansion to the container shell so a custom PORT is honoured.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:$${PORT:-8000}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  ota_signing_key:
    file: ${OTA_SIGNING_KEY_FILE:-./secrets/ota_ed25519.key}

volumes:
  tracker-cache:
